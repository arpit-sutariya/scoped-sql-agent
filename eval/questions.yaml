# Answer-accuracy test set. Each question is asked by a specific user.
#   expected: the outcome(s) that count as correct (answer | clarify | cannot_answer | refused)
#   reference_sql: for answers, the true value is computed by running this SQL AS THAT USER (so it
#                  respects their access), then compared with the agent's `value`
#   kind: number (1% tolerance) | percent (0.5 points) | text (case-insensitive match)
#   expect_caveat: the answer must mention a data-quality caveat

- id: rev_2025
  category: answerable
  user: priya
  question: What was our total revenue in 2025?
  expected: [answer]
  kind: number
  reference_sql: SELECT SUM(total_usd) FROM orders WHERE status IN ('delivered','shipped') AND order_date BETWEEN '2025-01-01' AND '2025-12-31'

- id: top_region_q3
  category: answerable
  user: priya
  question: Which region had the highest revenue in Q3 2026?
  expected: [answer]
  kind: text
  reference_sql: SELECT region FROM orders WHERE status IN ('delivered','shipped') AND order_date BETWEEN '2026-07-01' AND '2026-09-30' GROUP BY region ORDER BY SUM(total_usd) DESC LIMIT 1

- id: west_rev_ytd
  category: answerable
  user: maria
  question: What's our revenue so far this year?
  expected: [answer]
  kind: number
  reference_sql: SELECT SUM(total_usd) FROM orders WHERE status IN ('delivered','shipped') AND order_date BETWEEN '2026-01-01' AND '2026-10-31'

- id: east_cancelled_2026
  category: answerable
  user: dev
  question: How many orders were cancelled in 2026?
  expected: [answer]
  kind: number
  reference_sql: SELECT COUNT(*) FROM orders WHERE status = 'cancelled' AND order_date >= '2026-01-01'

- id: aov_2026
  category: answerable
  user: priya
  question: What's the average order value in 2026?
  expected: [answer]
  kind: number
  reference_sql: SELECT SUM(total_usd) / COUNT(*) FROM orders WHERE status IN ('delivered','shipped') AND order_date >= '2026-01-01'

- id: west_active_customers
  category: answerable
  user: maria
  question: How many active customers do I have?
  expected: [answer]
  kind: number
  reference_sql: SELECT COUNT(DISTINCT customer_id) FROM orders WHERE status IN ('delivered','shipped') AND order_date BETWEEN '2025-11-01' AND '2026-10-31'

- id: churned_all
  category: answerable
  user: priya
  question: How many customers have churned?
  expected: [answer]
  kind: number
  reference_sql: SELECT COUNT(*) FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.status IN ('delivered','shipped')) AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.status IN ('delivered','shipped') AND o.order_date >= '2025-11-01')

- id: urgent_resolution
  category: answerable
  user: sam
  question: What's our average resolution time in hours for urgent tickets?
  expected: [answer]
  kind: number
  reference_sql: SELECT AVG(resolution_hours) FROM tickets WHERE priority = 'urgent' AND status IN ('solved','closed') AND resolution_hours IS NOT NULL

- id: csat_avg
  category: answerable
  user: sam
  question: What's our average CSAT score?
  expected: [answer]
  kind: number
  reference_sql: SELECT AVG(csat) FROM tickets WHERE csat IS NOT NULL

- id: open_tickets
  category: answerable
  user: sam
  question: How many tickets are still open or pending?
  expected: [answer]
  kind: number
  reference_sql: SELECT COUNT(*) FROM tickets WHERE status IN ('open','pending')

- id: east_top_category
  category: answerable
  user: dev
  question: Which product category brought in the most revenue for my region in 2026?
  expected: [answer]
  kind: text
  reference_sql: SELECT p.category FROM order_lines l JOIN orders o ON o.order_id = l.order_id JOIN products p ON p.sku = l.sku WHERE o.status IN ('delivered','shipped') AND o.order_date >= '2026-01-01' GROUP BY p.category ORDER BY SUM(l.line_total) DESC LIMIT 1

- id: top_rep_2026
  category: answerable
  user: priya
  question: Which sales rep's accounts generated the most revenue in 2026?
  expected: [answer]
  kind: text
  reference_sql: SELECT r.name FROM orders o JOIN customers c ON c.customer_id = o.customer_id JOIN reps r ON r.rep_id = c.owner_rep_id WHERE o.status IN ('delivered','shipped') AND o.order_date >= '2026-01-01' GROUP BY r.name ORDER BY SUM(o.total_usd) DESC LIMIT 1

- id: west_top_customer_2025
  category: answerable
  user: maria
  question: Which customer spent the most with us in 2025?
  expected: [answer]
  kind: text
  reference_sql: SELECT c.name FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE o.status IN ('delivered','shipped') AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY c.name ORDER BY SUM(o.total_usd) DESC LIMIT 1

- id: prospects_count
  category: answerable
  user: priya
  question: How many prospects are in the CRM that have never ordered?
  expected: [answer]
  kind: number
  reference_sql: SELECT COUNT(*) FROM prospects

- id: east_tickets_2026
  category: answerable
  user: dev
  question: How many support tickets did my customers open in 2026?
  expected: [answer]
  kind: number
  reference_sql: SELECT COUNT(*) FROM tickets WHERE opened_at >= '2026-01-01'

- id: west_share_2026
  category: answerable
  user: priya
  question: What percentage of 2026 revenue came from the West region?
  expected: [answer]
  kind: percent
  reference_sql: SELECT 100.0 * SUM(CASE WHEN region = 'West' THEN total_usd ELSE 0 END) / SUM(total_usd) FROM orders WHERE status IN ('delivered','shipped') AND order_date >= '2026-01-01'

- id: returned_2025
  category: answerable
  user: priya
  question: How much were returned orders worth in 2025?
  expected: [answer]
  kind: number
  reference_sql: SELECT SUM(total_usd) FROM orders WHERE status = 'returned' AND order_date BETWEEN '2025-01-01' AND '2025-12-31'

- id: east_no_owner
  category: answerable
  user: dev
  question: How many customers in my region have no sales rep assigned?
  expected: [answer]
  kind: number
  expect_caveat: true
  reference_sql: SELECT COUNT(*) FROM customers WHERE owner_rep_id IS NULL

